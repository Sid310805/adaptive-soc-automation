<!DOCTYPE html>
<html>
<head>
    <title>Adaptive SOC Platform</title>
    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#0f172a;
            color:white;
        }

        .header{
            background:#1e293b;
            padding:20px;
            text-align:center;
            font-size:30px;
            font-weight:bold;
        }

        .container{
            padding:30px;
        }

        .cards{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:10px;
            width:220px;
            text-align:center;
        }

        h2{
            margin:0;
        }

        .value{
            font-size:40px;
            color:#22c55e;
            margin-top:10px;
        }

        table{
            width:100%;
            margin-top:40px;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #334155;
            padding:12px;
        }

        th{
            background:#334155;
        }
    </style>
</head>

<body>

<div class="header">
🛡 Adaptive SOC Platform with Explainable AI
</div>

<div class="container">

<div class="cards">

<div class="card">
<h2>Total Alerts</h2>
<div class="value">0</div>
</div>

<div class="card">
<h2>Critical</h2>
<div class="value">0</div>
</div>

<div class="card">
<h2>Incidents</h2>
<div class="value">0</div>
</div>

<div class="card">
<h2>SOAR Actions</h2>
<div class="value">0</div>
</div>

</div>

<h2 style="margin-top:40px;">Recent Alerts</h2>

<table>
<tr>
<th>Time</th>
<th>Alert</th>
<th>Severity</th>
<th>AI Explanation</th>
</tr>

<tr>
<td colspan="4" style="text-align:center;">
No alerts available
</td>
</tr>

</table>

</div>

</body>
</html>
